# koh/sylius-webmcp — auto-inject the WebMCP tool-registration script into the
# Sylius storefront via Twig Hooks (Sylius 2.x). This renders _webmcp_script.html.twig
# at the end of the shop base template (after the page scripts).
#
# NOTE: verify the hook name against your Sylius version's hookable templates
# (bin/console debug:twig-hook sylius_shop.base) -- 'sylius_shop.base.javascripts'
# is the documented JS hook; adjust if your theme overrides it.
sylius_twig_hooks:
    hooks:
        'sylius_shop.base#javascripts':
            webmcp:
                template: '@KohSyliusWebmcp/_webmcp_script.html.twig'
                priority: -100
